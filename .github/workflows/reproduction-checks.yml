name: Reproduction checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  dataset-free:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pytest -q
      - run: python -m plench.train --help
      - run: python -m reproduction.llp_gan_pytorch.train --help
      - run: python scripts/summarize_paper_evidence.py --check
      - run: python scripts/summarize_cluster.py --check
      - run: python scripts/reproduce_paper.py --list
